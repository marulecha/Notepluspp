# Builds the macOS app and attaches it to a GitHub release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Notepluspp ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
